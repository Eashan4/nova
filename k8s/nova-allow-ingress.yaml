# Complements hipaa-isolation: HIPAA-labelled Nova pods stay isolated, except the Traefik ingress controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-nova
spec:
  podSelector:
    matchLabels: { app: nova, compliance: hipaa }
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: kube-system }
      podSelector:
        matchLabels: { app.kubernetes.io/name: traefik }
    ports:
    - { protocol: TCP, port: 3000 }
